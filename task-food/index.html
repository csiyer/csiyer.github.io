<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Choice Task</title>

    <script src="https://unpkg.com/jspsych@8.2.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-slider-response@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-preload@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-fullscreen@2.0.0"></script>
    <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe@0.5.0"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <link rel="stylesheet" href="https://unpkg.com/jspsych@8.2.3/css/jspsych.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #ffffff;
            color: #333333;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .jspsych-content-wrapper {
            max-width: 1300px;
        }

        /* ── Instruction panels (same as the other tasks) ── */
        .instruction-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 36px 36px 28px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.08);
            text-align: left;
            line-height: 1.65;
            font-size: 1.1rem;
        }

        .instruction-container h2 {
            margin: 0 0 16px;
            font-weight: 800;
            color: #171717;
            text-align: center;
        }

        .jspsych-btn {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 999px;
            background: #171717;
            color: #ffffff;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
            cursor: pointer;
        }

        .jspsych-btn:disabled {
            background: #9a9a9a;
            cursor: not-allowed;
        }

        /* ── Comprehension quiz (survey-multi-choice) ── */
        #jspsych-survey-multi-choice_form {
            max-width: 900px;
            margin: 0 auto;
            text-align: left;
        }

        .jspsych-survey-multi-choice-question {
            margin: 18px 0;
        }

        .jspsych-survey-multi-choice-text {
            font-weight: 600;
        }

        /* ── Task displays: Li et al. (2022) style.css ── */
        .food-img {
            width: 300px;
            padding: 10px;
        }

        .choice-img {
            width: 300px;
            padding: 20px;
            margin: 5px;
            border: 5px solid #555;
        }

        .choice-img.picked {
            border-color: #55CC33;
        }

        p.subtitle2 {
            text-align: center;
            font-size: 28px;
            line-height: 42px;
        }

        .fix {
            display: inline-block;
            text-align: center;
            vertical-align: middle;
            font-size: 72px;
        }

        .choice-message {
            font-size: 40px;
        }

        /* Turnstile verification styles */
        .turnstile-page { text-align: center; }
        .turnstile-widget { display: flex; justify-content: center; margin-bottom: 20px; }
        .turnstile-status { font-size: 22px; margin-top: 20px; min-height: 30px; }
        .turnstile-success { color: #4CAF50; }
        .turnstile-fail { color: #f44336; }
    </style>
</head>

<body>
    <script src="memorability_choice_image.js"></script>
</body>

</html>
